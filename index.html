<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fitfinder</title>
  <meta name="description" content="Answer a few questions about your style and get clothing picks with links to shops that carry them.">
  <meta name="theme-color" content="#f6f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151210" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fitfinder">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <button id="back" class="icon-btn" aria-label="Back" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="home" class="brand">Fitfinder</button>
      <div class="topbar-actions">
        <button id="open-saved" class="icon-btn" aria-label="Saved items">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.8 3.6 4.5 7 4.5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.4 0 5.6 3.3 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span id="saved-count" class="badge" hidden>0</span>
        </button>
        <button id="open-settings" class="icon-btn" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></g></svg>
        </button>
      </div>
    </div>
    <div id="progress" class="progress" hidden><div id="progress-bar"></div></div>
  </header>

  <main id="view"></main>
  <footer id="actions" class="actions" hidden></footer>
  <div id="toast" class="toast" role="status"></div>

  <dialog id="settings-dialog" class="sheet">
    <form id="settings-form" method="dialog">
      <div class="sheet-head">
        <h2>Settings</h2>
        <button type="button" class="icon-btn" aria-label="Close" onclick="this.closest('dialog').close()">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <p id="settings-msg" class="note" hidden></p>
      <label class="field">
        <span>DeepInfra API key</span>
        <div class="input-row">
          <input id="api-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste your key">
          <button id="toggle-key" type="button" class="btn ghost small">Show</button>
        </div>
        <small>Get one at <a href="https://deepinfra.com/dash/api_keys" target="_blank" rel="noopener">deepinfra.com</a>. It's stored only on this device and sent only to DeepInfra.</small>
      </label>
      <label class="field">
        <span>Model</span>
        <div class="input-row">
          <input id="model" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
          <button id="reset-model" type="button" class="btn ghost small">Default</button>
        </div>
        <small>Any chat model on DeepInfra, e.g. deepseek-ai/DeepSeek-V4.1-Flash-1017.</small>
      </label>
      <div class="test-row">
        <button id="test-key" type="button" class="btn ghost">Test connection</button>
        <span id="test-result" class="sub"></span>
      </div>
      <button type="submit" class="btn primary block">Save</button>
      <button id="clear-data" type="button" class="link danger">Clear answers and saved items</button>
    </form>
  </dialog>

  <dialog id="saved-dialog" class="sheet">
    <div class="sheet-head">
      <h2>Saved</h2>
      <button type="button" class="icon-btn" aria-label="Close" onclick="this.closest('dialog').close()">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="saved-body" class="items"></div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
